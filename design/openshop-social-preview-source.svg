  <text x="60" y="350" fill="#b7c2d3" font-family="Segoe UI, Arial, sans-serif" font-size="21">Layers, selections, PSD interchange, and local export.</text>
  <text x="60" y="382" fill="#b7c2d3" font-family="Segoe UI, Arial, sans-serif" font-size="21">No signup or upload step.</text>

